name: Disassemble server-list writer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disassemble-serverlist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Get client library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
      - name: Disassemble writer/parser
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn \
            --start-address=0x1ea0f80 --stop-address=0x1ea1f80 "$LIB" > reports/serverlist-disassembly.txt
          aarch64-linux-gnu-nm -D -C "$LIB" | grep 'ParseServerListFile' > reports/serverlist-symbols.txt || true
          strings -a -t x "$LIB" | grep -Eai 'server_list|serverlist|WriteServerList|ParseINI|ParseBuffer|ServerName|ServerAddr|server_addr|server_port|section|ini' \
            | head -n 4000 > reports/serverlist-strings.txt || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-serverlist-disassembly
          path: reports/
          retention-days: 7
