name: Recover member login packet builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-login-packet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download libapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
      - name: Find native string xrefs
        shell: bash
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          strings -a -t x "$LIB" > work/strings.txt
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn "$LIB" > work/full.txt
          python3 - <<'PY'
          from pathlib import Path
          from collections import deque
          import re

          targets={}
          wanted=(
              'GameNet::ConnectMemberServer:',
              'GameNet::FirstLoginMemberServer',
              'GameNet::ReLoginMemberServer',
              '(send_login)account size no buffer',
              '(send_login)account no buffer',
              '(send_login)password size no buffer',
              '(send_login)password no buffer',
              '(send_login)login string size no buffer',
              '(send_login)login string no buffer',
              '(send_login)login type no buffer',
              '(send_login)login in_stub size no buffer',
              '(send_login)login os type size no buffer',
              'SERVER_LOGIN_SUCCEED',
              'on_login_succeed',
          )
          for line in Path('work/strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)$', line)
              if not m: continue
              s=m.group(2)
              if any(s.startswith(w) for w in wanted):
                  targets[int(m.group(1),16)]=s
          Path('reports/login-target-strings.txt').write_text('\n'.join(f'0x{a:x}\t{s}' for a,s in sorted(targets.items()))+'\n')

          lines=Path('work/full.txt').read_text(errors='replace').splitlines()
          regs={}
          hits=[]
          for i,line in enumerate(lines):
              ma=re.search(r'^\s*([0-9a-fA-F]+):\s+adrp\s+(x\d+),\s*([0-9a-fA-F]+)', line)
              if ma:
                  regs[ma.group(2)]=(int(ma.group(3),16),i)
              mb=re.search(r'^\s*([0-9a-fA-F]+):\s+add\s+(x\d+),\s*(x\d+),\s*#0x([0-9a-fA-F]+)', line)
              if mb and mb.group(2)==mb.group(3) and mb.group(3) in regs:
                  page,seen=regs[mb.group(3)]
                  if i-seen <= 30:
                      va=page+int(mb.group(4),16)
                      if va in targets:
                          hits.append((i,va,int(mb.group(1),16),targets[va]))
              mc=re.search(r'^\s*([0-9a-fA-F]+):\s+adr\s+(x\d+),\s*([0-9a-fA-F]+)', line)
              if mc:
                  va=int(mc.group(3),16)
                  if va in targets:
                      hits.append((i,va,int(mc.group(1),16),targets[va]))

          out=[]
          for i,va,pc,s in hits:
              out.append(f'===== STRING XREF pc=0x{pc:x} target=0x{va:x}: {s} =====')
              out.extend(lines[max(0,i-260):min(len(lines),i+321)])
              out.append('')
          Path('reports/login-string-xrefs.txt').write_text('\n'.join(out),encoding='utf-8')
          Path('reports/login-xref-summary.txt').write_text('\n'.join(f'pc=0x{pc:x}\tstr=0x{va:x}\t{s}' for _,va,pc,s in hits)+'\n')
          print(Path('reports/login-target-strings.txt').read_text())
          print(Path('reports/login-xref-summary.txt').read_text())
          PY
      - name: Extract interesting calls and constants around xrefs
        run: |
          grep -E '^(=====|[[:space:]]*[0-9a-f]+:.*(bl|blr|mov[[:space:]]+w[0-7],#|str[[:space:]]+w|ldr[[:space:]]+w|memcpy|strlen|malloc|free))' reports/login-string-xrefs.txt > reports/login-xrefs-condensed.txt || true
          head -n 1200 reports/login-xrefs-condensed.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-login-packet-builder
          path: reports/
          retention-days: 7
