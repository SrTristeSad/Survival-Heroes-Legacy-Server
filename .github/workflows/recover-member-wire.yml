name: Recover legacy member wire framing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-member-wire.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download libapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
      - name: Dump focused native ranges
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=0x706800 --stop-address=0x707a00 "$LIB" > reports/member-sender.txt
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=0x1e9d900 --stop-address=0x1e9e350 "$LIB" > reports/len-split-protocol.txt
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=0x6f3b80 --stop-address=0x6f4070 "$LIB" > reports/server-set-verify.txt
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=0x6fc000 --stop-address=0x6fd100 "$LIB" > reports/server-login-succeed.txt
          aarch64-linux-gnu-nm -D -n -C "$LIB" | grep -E 'LenSplitProtocol|CNetWork::(ConnectServer|SendData|RecvData|Process)|GameSender|GameReceiver' > reports/relevant-symbols.txt || true
      - name: Resolve focused strings
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          strings -a -t x "$LIB" > work/strings.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          smap={}
          for line in Path('work/strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)',line)
              if m: smap[int(m.group(1),16)] = m.group(2)
          for fn in ['member-sender.txt','len-split-protocol.txt','server-set-verify.txt','server-login-succeed.txt']:
              lines=Path('reports/'+fn).read_text(errors='replace').splitlines()
              regs={}; out=[]
              for i,line in enumerate(lines):
                  ma=re.search(r'^\s*([0-9a-fA-F]+):\s+adrp\s+(x\d+),\s*([0-9a-fA-F]+)',line)
                  if ma: regs[ma.group(2)]=(int(ma.group(3),16),i)
                  mb=re.search(r'^\s*([0-9a-fA-F]+):\s+add\s+(x\d+),\s*(x\d+),\s*#0x([0-9a-fA-F]+)',line)
                  if mb and mb.group(2)==mb.group(3) and mb.group(2) in regs:
                      page,seen=regs[mb.group(2)]
                      if i-seen <= 30:
                          a=page+int(mb.group(4),16)
                          if a in smap: out.append(f'pc=0x{mb.group(1)} str=0x{a:x} {smap[a]}')
              Path('reports/'+fn.replace('.txt','-strings.txt')).write_text('\n'.join(out)+'\n')
          PY
      - name: Find direct calls and constants
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn "$LIB" | grep -E -B12 -A22 'bl[[:space:]]+707058|bl[[:space:]]+6f3c50|1e9d9f0|1e9e09c' > reports/direct-callers.txt || true
          grep -E -n -B10 -A20 'strb.*\[.*\]|stur.*#1|mov.*#0x300|mov.*#0xc9|mov.*#0xc8|mov.*#0x64' reports/member-sender.txt > reports/member-header-constants.txt || true
      - name: Find login-success size-error xref
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          strings -a -t x "$LIB" | grep -E 'GameReceiver::ServerLoginSucceed|GameReceiver::ServerSetVerify|CLIENT_GET_VERIFY|SERVER_SET_VERIFY|SERVER_LOGIN_SUCCEED' > reports/key-strings.txt || true
          cat reports/key-strings.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-member-wire
          path: reports/
          retention-days: 7
