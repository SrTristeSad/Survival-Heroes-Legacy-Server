name: Prove scene composite key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prove-scene-key.yml'
      - 'docs/SCENE_KEY_PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download libapp only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
          cp work/apk/lib/arm64-v8a/libapp.so work/libapp.so
      - name: Inventory scene loader strings
        run: |
          strings -a -t x work/libapp.so > work/strings.txt
          aarch64-linux-gnu-readelf -SW work/libapp.so > work/sections.txt
          grep -Eai 'share/scenes\.ini|scenes\.ini|Clonable|BattleWarID|MapGroup|Member$|Scene$|Config$|Script$|%u-%u' work/strings.txt > reports/scene-loader-strings.txt || true
          aarch64-linux-gnu-nm -D -n -C work/libapp.so | grep -Eai 'Scene.*(Load|Init|Info|Config)|Load.*Scene|Parse.*Scene|SceneManager|SceneMgr' > reports/scene-loader-symbols.txt || true
      - name: Resolve xrefs
        run: |
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn work/libapp.so > work/disasm.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          secs=[]
          for line in Path('work/sections.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*\[\s*\d+\]\s+(\S+)\s+\S+\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',line)
              if m:
                  _,a,o,s=m.groups(); secs.append((int(a,16),int(o,16),int(s,16)))
          targets=[]
          for line in Path('reports/scene-loader-strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)',line)
              if not m: continue
              fo=int(m.group(1),16); text=m.group(2); va=None
              for a,o,s in secs:
                  if o<=fo<o+s: va=a+(fo-o); break
              if va is not None: targets.append((va,text,fo))
          lines=Path('work/disasm.txt').read_text(errors='replace').splitlines()
          pages={}
          for i,line in enumerate(lines):
              m=re.search(r'adrp\s+(x\d+),\s*([0-9a-fA-F]+)',line)
              if m: pages.setdefault(int(m.group(2),16),[]).append((i,m.group(1)))
          out=[]; addrs=set()
          for va,text,fo in targets:
              page=va & ~0xfff; off=va & 0xfff
              for i,reg in pages.get(page,[]):
                  for j in range(i+1,min(i+10,len(lines))):
                      m=re.search(rf'add\s+{reg},\s*{reg},\s*#0x([0-9a-fA-F]+)',lines[j])
                      if m and int(m.group(1),16)==off:
                          am=re.match(r'\s*([0-9a-fA-F]+):',lines[i])
                          if am:
                              addr=int(am.group(1),16); addrs.add(addr)
                              out.append(f'===== {text} xref=0x{addr:x} string=0x{va:x} =====')
                              out.extend(lines[max(0,i-100):min(len(lines),j+240)])
                          break
          Path('reports/scene-loader-xrefs.txt').write_text('\n'.join(out),encoding='utf-8')
          Path('reports/xref-addresses.txt').write_text('\n'.join(hex(a) for a in sorted(addrs)),encoding='utf-8')
          PY
      - name: Dump broad loader windows
        run: |
          : > reports/scene-loader-windows.txt
          while read -r addr; do
            [ -n "$addr" ] || continue
            n=$((addr)); start=$((n-0x1800)); stop=$((n+0x3000)); [ $start -lt 0 ] && start=0
            echo "===== xref $addr =====" >> reports/scene-loader-windows.txt
            aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=$start --stop-address=$stop work/libapp.so >> reports/scene-loader-windows.txt || true
          done < reports/xref-addresses.txt
      - uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-scene-key-proof
          path: reports/
          retention-days: 7
