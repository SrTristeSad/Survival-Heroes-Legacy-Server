name: Recover exact legacy member opcodes

# Focused recovery of the final old-protocol wire constants.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-member-opcodes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download libapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
      - name: Inspect LenSplitProtocol data and vtable
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          aarch64-linux-gnu-nm -D -n -C "$LIB" | grep -E 'LenSplitProtocol|m_nProtocolSize' > reports/lensplit-symbols.txt || true
          aarch64-linux-gnu-readelf -Ws "$LIB" | grep -E 'LenSplitProtocol|m_nProtocolSize' > reports/lensplit-readelf.txt || true
          aarch64-linux-gnu-objdump -s --start-address=0x2c03840 --stop-address=0x2c03890 "$LIB" > reports/lensplit-size-data.txt || true
          aarch64-linux-gnu-objdump -s --start-address=0x2bbfc20 --stop-address=0x2bbfc90 "$LIB" > reports/lensplit-vtable-data.txt || true
          aarch64-linux-gnu-readelf -rW "$LIB" | grep -Ei '2bbfc|2c03860|LenSplit' > reports/lensplit-relocations.txt || true
      - name: Dump receiver dispatcher
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=0x6ff400 --stop-address=0x700080 "$LIB" > reports/receiver-dispatcher.txt
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=0x706f00 --stop-address=0x707080 "$LIB" > reports/get-verify-sender.txt
          strings -a -t x "$LIB" > work/strings.txt
      - name: Resolve dispatcher strings and targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          smap={}
          for line in Path('work/strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)',line)
              if m: smap[int(m.group(1),16)] = m.group(2)
          for fn in ['receiver-dispatcher.txt','get-verify-sender.txt']:
              lines=Path('reports/'+fn).read_text(errors='replace').splitlines()
              regs={}; out=[]
              for i,line in enumerate(lines):
                  ma=re.search(r'^\s*([0-9a-fA-F]+):\s+adrp\s+(x\d+),\s*([0-9a-fA-F]+)',line)
                  if ma: regs[ma.group(2)]=(int(ma.group(3),16),i)
                  mb=re.search(r'^\s*([0-9a-fA-F]+):\s+add\s+(x\d+),\s*(x\d+),\s*#0x([0-9a-fA-F]+)',line)
                  if mb and mb.group(2)==mb.group(3) and mb.group(2) in regs:
                      page,seen=regs[mb.group(2)]
                      if i-seen <= 30:
                          a=page+int(mb.group(4),16)
                          if a in smap:
                              out.append(f'pc=0x{mb.group(1)} str=0x{a:x} {smap[a]}')
              Path('reports/'+fn.replace('.txt','-strings.txt')).write_text('\n'.join(out)+'\n')
          PY
          grep -E -n -B35 -A60 '6f3c50|6fc1c0|6f3f74|6f40c0' reports/receiver-dispatcher.txt > reports/receiver-handler-calls.txt || true
      - name: Inspect all local symbols around LenSplit vtable targets
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          aarch64-linux-gnu-nm -n -C "$LIB" | grep -E 'LenSplit|2bbfc|2c038' > reports/lensplit-all-symbols.txt || true
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=0x1e9d700 --stop-address=0x1e9e330 "$LIB" > reports/lensplit-full-nearby.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-member-opcodes
          path: reports/
          retention-days: 7
