name: Recover login success compact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download libapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
          cp work/apk/lib/arm64-v8a/libapp.so work/libapp.so
      - name: Extract login success evidence
        run: |
          aarch64-linux-gnu-readelf -SW work/libapp.so > reports/sections.txt
          strings -a -t x work/libapp.so | grep -Eai 'ServerLoginSucceed|SERVER_LOGIN_SUCCEED|on_login_succeed|role parameter type error|create role|select role|role list|role_' > reports/login-success-strings.txt || true
          aarch64-linux-gnu-nm -D -n -C work/libapp.so | grep -Eai 'ServerLoginSucceed|LoginSucceed|Role|CreateRole|SelectRole' > reports/login-success-symbols.txt || true
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn work/libapp.so > work/disasm.txt
          python3 scripts/recover_login_success.py
          : > reports/login-success-function-windows.txt
          while read -r addr; do
            [ -n "$addr" ] || continue
            n=$((addr)); start=$((n-4608)); stop=$((n+12288)); [ $start -lt 0 ] && start=0
            printf '\n===== xref %s =====\n' "$addr" >> reports/login-success-function-windows.txt
            aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=$start --stop-address=$stop work/libapp.so >> reports/login-success-function-windows.txt || true
          done < reports/xref-addrs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-login-success-compact
          path: reports/
          retention-days: 7
