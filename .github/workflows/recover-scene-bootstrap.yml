name: Recover scene bootstrap protocol

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-scene-bootstrap.yml'
      - 'docs/SCENE_BOOTSTRAP_RECOVERY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download archived client library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
          cp work/apk/lib/arm64-v8a/libapp.so work/libapp.so
      - name: Inventory early scene handlers
        run: |
          strings -a -t x work/libapp.so > work/strings.txt
          aarch64-linux-gnu-readelf -SW work/libapp.so > work/sections.txt
          aarch64-linux-gnu-nm -D -n -C work/libapp.so > work/nm.txt || true
          grep -Eai 'SERVER_PROPERTY_TABLE|SERVER_RECORD_TABLE|SERVER_ENTRY_SCENE(_EX)?|Server(PropertyTable|RecordTable|EntryScene)|on_(property|record|entry).*|property table|record table|entry scene|scene.*size error' work/strings.txt > reports/target-strings.txt || true
          grep -Eai 'GameReceiver.*(Property|Record|Entry|Scene)|Server(PropertyTable|RecordTable|EntryScene)' work/nm.txt > reports/target-symbols.txt || true
      - name: Resolve target string xrefs
        run: |
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn work/libapp.so > work/disasm.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          sections=[]
          for line in Path('work/sections.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*\[\s*\d+\]\s+(\S+)\s+\S+\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',line)
              if m:
                  _,addr,off,size=m.groups(); sections.append((int(addr,16),int(off,16),int(size,16)))

          targets=[]
          for line in Path('reports/target-strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)',line)
              if not m: continue
              foff=int(m.group(1),16); text=m.group(2); va=None
              for addr,off,size in sections:
                  if off <= foff < off+size:
                      va=addr+(foff-off); break
              if va is not None: targets.append((va,text,foff))

          lines=Path('work/disasm.txt').read_text(errors='replace').splitlines()
          by_page={}
          for i,line in enumerate(lines):
              m=re.search(r'adrp\s+(x\d+),\s*([0-9a-fA-F]+)',line)
              if m: by_page.setdefault(int(m.group(2),16),[]).append((i,m.group(1)))

          out=[]; addrs=set()
          for va,text,foff in targets:
              page=va & ~0xfff; off=va & 0xfff
              for i,reg in by_page.get(page,[]):
                  for j in range(i+1,min(i+10,len(lines))):
                      m=re.search(rf'add\s+{reg},\s*{reg},\s*#0x([0-9a-fA-F]+)',lines[j])
                      if m and int(m.group(1),16)==off:
                          am=re.match(r'\s*([0-9a-fA-F]+):',lines[i])
                          if am:
                              a=int(am.group(1),16); addrs.add(a)
                              out.append(f'===== {text} xref=0x{a:x} string_va=0x{va:x} file=0x{foff:x} =====')
                              out.extend(lines[max(0,i-120):min(len(lines),j+300)])
                          break
          Path('reports/target-xrefs.txt').write_text('\n'.join(out),encoding='utf-8')
          Path('reports/xref-addresses.txt').write_text('\n'.join(hex(a) for a in sorted(addrs)),encoding='utf-8')
          PY
      - name: Dump broad handler windows
        run: |
          : > reports/target-windows.txt
          while read -r addr; do
            [ -n "$addr" ] || continue
            n=$((addr)); start=$((n-0x2000)); stop=$((n+0x5000)); [ $start -lt 0 ] && start=0
            echo "===== xref $addr =====" >> reports/target-windows.txt
            aarch64-linux-gnu-objdump -d -C --no-show-raw-insn --start-address=$start --stop-address=$stop work/libapp.so >> reports/target-windows.txt || true
          done < reports/xref-addresses.txt
      - uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-scene-bootstrap-recovery
          path: reports/
          retention-days: 7
