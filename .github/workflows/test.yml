name: Test server

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/analyze-client.yml'
      - '.github/workflows/deep-analyze-client.yml'
      - '.github/workflows/index-pck0.yml'
      - '.github/workflows/disassemble-network.yml'
      - '.github/workflows/disassemble-msgbuf.yml'
      - '.github/workflows/disassemble-serverlist.yml'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: |
          test -z "$(gofmt -l cmd internal)" || { gofmt -d cmd internal; exit 1; }
      - name: Unit tests
        run: go test ./...
      - name: Build
        run: make build
      - name: Docker compose validation
        run: docker compose config >/dev/null
