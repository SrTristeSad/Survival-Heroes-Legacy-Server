name: Analisar origem da configuracao do cliente

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-server-config.yml'
      - 'docs/ANALISE_SERVER_TXT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Baixar cliente arquivado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          APK="$(find work/xapk -type f -name '*.apk' | head -n1)"
          unzip -q "$APK" 'lib/arm64-v8a/libapp.so' 'assets/config.ini' -d work/apk
          cp work/apk/lib/arm64-v8a/libapp.so work/libapp.so
          cp work/apk/assets/config.ini reports/config-original.ini
      - name: Gerar inventario e disassembly
        run: |
          strings -a -t x work/libapp.so > work/strings.txt
          aarch64-linux-gnu-nm -D -n -C work/libapp.so > work/nm.txt || true
          aarch64-linux-gnu-readelf -SW work/libapp.so > work/sections.txt
          aarch64-linux-gnu-readelf -rW work/libapp.so > work/relocs.txt || true
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn work/libapp.so > work/disasm.txt
          grep -Eai 'config\.ini|server_query|server_list\.ini|FileUtils|writable|external|storage|asset|GetString|GetInt|Ini|INI|fopen|open\(' work/strings.txt > reports/strings-config.txt || true
          grep -Eai 'FileUtils|writable|external|storage|asset|Ini|INI|fopen|open|GetString|GetInt' work/nm.txt > reports/simbolos-config.txt || true
      - name: Resolver referencias de config.ini e server_query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          secs=[]
          for line in Path('work/sections.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*\[\s*\d+\]\s+(\S+)\s+\S+\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',line)
              if m:
                  _,a,o,s=m.groups(); secs.append((int(a,16),int(o,16),int(s,16)))
          wanted=[]
          for line in Path('work/strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)',line)
              if not m: continue
              fo=int(m.group(1),16); text=m.group(2)
              if not re.search(r'config\.ini|server_query|Addr$|Port$|Issuer$|GameID$', text, re.I):
                  continue
              va=None
              for a,o,s in secs:
                  if o <= fo < o+s:
                      va=a+(fo-o); break
              if va is not None: wanted.append((va,text))
          lines=Path('work/disasm.txt').read_text(errors='replace').splitlines()
          pages={}
          for i,line in enumerate(lines):
              m=re.search(r'adrp\s+(x\d+),\s*([0-9a-fA-F]+)',line)
              if m: pages.setdefault(int(m.group(2),16),[]).append((i,m.group(1)))
          out=[]
          for va,text in wanted:
              page=va & ~0xfff; off=va & 0xfff
              for i,reg in pages.get(page,[]):
                  for j in range(i+1,min(i+12,len(lines))):
                      m=re.search(rf'add\s+{reg},\s*{reg},\s*#0x([0-9a-fA-F]+)',lines[j])
                      if m and int(m.group(1),16)==off:
                          out.append(f'===== {text} @0x{va:x} xref =====')
                          out.extend(lines[max(0,i-120):min(len(lines),j+260)])
                          break
          Path('reports/xrefs-config.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Provar funcao que fornece o caminho base
        run: |
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn \
            --start-address=0x956f00 --stop-address=0x958200 work/libapp.so \
            > reports/path-provider-disasm.txt || true
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn \
            --start-address=0xa4f900 --stop-address=0xa4fc80 work/libapp.so \
            > reports/server-query-loader-disasm.txt || true
          grep -E 'getWritablePath|getPersistentStoragePath|getExternalStoragePath|fullPathForFilename|addSearchPath|setSearchPaths' work/nm.txt \
            > reports/storage-api-addresses.txt || true
      - name: Identificar singleton e inicializacao
        run: |
          grep -Ei '02be1d40|02bd9a48|02c633f8|02c7aba0|Application|FileUtils|AssetsManager|PackageSystem|GameOption|Storage|Writable|External' work/relocs.txt \
            > reports/relocacoes-caminho.txt || true
          grep -E 'Singleton|ApplicationKit::Application|FileUtils|AssetsManager|PackageSystem|GameOption|vtable for' work/nm.txt \
            > reports/singletons-candidatos.txt || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('work/disasm.txt').read_text(errors='replace').splitlines()
          target_page=0x2c633f8 & ~0xfff
          target_off=0x2c633f8 & 0xfff
          hits=[]
          for i,line in enumerate(lines):
              m=re.search(r'adrp\s+(x\d+),\s*([0-9a-fA-F]+)',line)
              if not m or int(m.group(2),16)!=target_page: continue
              reg=m.group(1)
              for j in range(i+1,min(i+20,len(lines))):
                  # direct add of object address
                  ma=re.search(rf'add\s+{reg},\s*{reg},\s*#0x([0-9a-fA-F]+)',lines[j])
                  # stores/loads using page register + immediate can also touch target
                  mm=re.search(rf'\[(?:{reg}),\s*#([0-9]+)\]',lines[j])
                  ok=(ma and int(ma.group(1),16)==target_off) or (mm and int(mm.group(1),10)==target_off)
                  if ok:
                      hits.append(f'===== direct xref target 0x2c633f8 near line {i} =====')
                      hits.extend(lines[max(0,i-100):min(len(lines),j+180)])
                      break
          Path('reports/inicializacao-provedor.txt').write_text('\n'.join(hits),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: analise-server-txt
          path: reports/
          retention-days: 7
