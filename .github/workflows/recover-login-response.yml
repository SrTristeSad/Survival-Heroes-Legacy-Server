name: Recover member login response flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-login-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download libapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
      - name: Build full indexes
        run: |
          LIB=work/apk/lib/arm64-v8a/libapp.so
          strings -a -t x "$LIB" > work/strings.txt
          aarch64-linux-gnu-nm -D -n -C "$LIB" > work/nm.txt || true
          aarch64-linux-gnu-objdump -d -C --no-show-raw-insn "$LIB" > work/full.txt
      - name: Trace login response strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wanted = (
              'SERVER_SET_VERIFY',
              'SERVER_LOGIN_SUCCEED',
              '(GameReceiver::ServerSetVerify)size error',
              'on_set_verify',
              'on_login_succeed',
              'rpc_login_success',
              '(RpcLoginReceiver::RpcSetVerify)size error',
              '(RpcLoginReceiver::RpcMsgBeatResponse)recv ms',
              'CLIENT_GET_VERIFY',
          )
          targets={}
          rows=[]
          for line in Path('work/strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)$',line)
              if not m: continue
              a=int(m.group(1),16); s=m.group(2)
              if any(w in s for w in wanted):
                  targets[a]=s; rows.append((a,s))
          Path('reports/response-targets.txt').write_text('\n'.join(f'0x{a:x}\t{s}' for a,s in rows)+'\n')

          lines=Path('work/full.txt').read_text(errors='replace').splitlines()
          regs={}; hits=[]
          for i,line in enumerate(lines):
              ma=re.search(r'^\s*([0-9a-fA-F]+):\s+adrp\s+(x\d+),\s*([0-9a-fA-F]+)',line)
              if ma:
                  regs[ma.group(2)]=(int(ma.group(3),16),i)
              mb=re.search(r'^\s*([0-9a-fA-F]+):\s+add\s+(x\d+),\s*(x\d+),\s*#0x([0-9a-fA-F]+)',line)
              if mb and mb.group(2)==mb.group(3) and mb.group(2) in regs:
                  page,seen=regs[mb.group(2)]
                  if i-seen <= 30:
                      va=page+int(mb.group(4),16)
                      if va in targets:
                          hits.append((i,int(mb.group(1),16),va,targets[va]))
              mc=re.search(r'^\s*([0-9a-fA-F]+):\s+adr\s+(x\d+),\s*([0-9a-fA-F]+)',line)
              if mc:
                  va=int(mc.group(3),16)
                  if va in targets:
                      hits.append((i,int(mc.group(1),16),va,targets[va]))

          out=[]
          seen=set()
          for i,pc,va,s in hits:
              key=(pc,va)
              if key in seen: continue
              seen.add(key)
              out.append(f'===== pc=0x{pc:x} target=0x{va:x} {s} =====')
              out.extend(lines[max(0,i-420):min(len(lines),i+520)])
              out.append('')
          Path('reports/response-xrefs.txt').write_text('\n'.join(out),encoding='utf-8')
          Path('reports/response-xref-summary.txt').write_text('\n'.join(f'pc=0x{pc:x}\tstr=0x{va:x}\t{s}' for _,pc,va,s in hits)+'\n')
          print(Path('reports/response-targets.txt').read_text())
          print(Path('reports/response-xref-summary.txt').read_text())
          PY
      - name: Collect receiver-related symbols
        run: |
          grep -Eai 'GameReceiver|RpcLogin|LoginReceiver|Receiver|SetVerify|LoginSucceed|RecvData|ProcessRecvData|LenSplitProtocol' work/nm.txt > reports/receiver-symbols.txt || true
          head -n 600 reports/receiver-symbols.txt
      - name: Dump nearby protobuf and login strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          rows=[]
          for line in Path('work/strings.txt').read_text(errors='replace').splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)$',line)
              if not m: continue
              a=int(m.group(1),16); s=m.group(2)
              if 0x24f0000 <= a <= 0x24f5000 or 0x2600000 <= a <= 0x2606000 or 0x248b000 <= a <= 0x2491000:
                  rows.append((a,s))
          Path('reports/login-nearby-strings.txt').write_text('\n'.join(f'0x{a:x}\t{s}' for a,s in rows)+'\n')
          PY
          grep -Eai 'login|verify|rpc|success|fail|result|account|role|server|session|token|uid|id' reports/login-nearby-strings.txt | head -n 800 || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-login-response-flow
          path: reports/
          retention-days: 7
