name: Recover protocol message table

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Download libapp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p client work/xapk work/apk reports
          gh release download apk --pattern '*.xapk' --dir client
          unzip -q "$(find client -type f -name '*.xapk' | head -n1)" -d work/xapk
          unzip -q "$(find work/xapk -type f -name '*.apk' | head -n1)" 'lib/arm64-v8a/libapp.so' -d work/apk
          cp work/apk/lib/arm64-v8a/libapp.so work/libapp.so
      - name: Dump protocol names and neighborhoods
        run: |
          strings -a -t x work/libapp.so > work/strings.txt
          awk '$1 ~ /^[0-9a-fA-F]+$/ {n=strtonum("0x"$1); if (n>=strtonum("0x248b000") && n<=strtonum("0x248d000")) print}' work/strings.txt > reports/server-enum-neighborhood.txt
          awk '$1 ~ /^[0-9a-fA-F]+$/ {n=strtonum("0x"$1); if (n>=strtonum("0x2522e00") && n<=strtonum("0x2523400")) print}' work/strings.txt > reports/client-enum-neighborhood.txt
          grep -E ' CLIENT_| SERVER_' work/strings.txt > reports/all-client-server-names.txt || true
          grep -Eai 'CREATE_ROLE|CHOOSE_ROLE|DELETE_ROLE|LOGIN_SUCCEED|LOGIN_FAIL|ENTER_GAME|ENTER_WORLD|ROLE.*(SUCCEED|FAIL)|CREATE.*(SUCCEED|FAIL)' work/strings.txt > reports/role-login-message-names.txt || true
          aarch64-linux-gnu-nm -D -n -C work/libapp.so | grep -Eai 'Game(Sender|Receiver)|CreateRole|ChooseRole|SelectRole|DeleteRole|EnterGame' > reports/network-symbols.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: survival-heroes-protocol-table
          path: reports/
          retention-days: 7
