services:
  query:
    build: .
    entrypoint: ["/usr/local/bin/query-server"]
    restart: unless-stopped
    environment:
      QUERY_ADDR: ":8088"
      QUERY_ISSUER: "${QUERY_ISSUER:-10000}"
      QUERY_GAME_ID: "${QUERY_GAME_ID:-125}"
      QUERY_SERVER_RECORDS: "${QUERY_SERVER_RECORDS:-}"
    ports:
      - "${QUERY_PORT:-88}:8088/tcp"

  gateway:
    build: .
    command: ["/usr/local/bin/gateway"]
    restart: unless-stopped
    environment:
      GATEWAY_ADDR: ":8080"
      GAME_PUBLIC_HOST: "${GAME_PUBLIC_HOST:-127.0.0.1}"
      GAME_PORT: "7000"
      MATCH_SIZE: "${MATCH_SIZE:-2}"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  game:
    build: .
    entrypoint: ["/usr/local/bin/game-server"]
    restart: unless-stopped
    environment:
      GAME_ADDR: ":7000"
    ports:
      - "${GAME_PORT:-7000}:7000/tcp"
