services:
  query:
    build: .
    entrypoint: ["/usr/local/bin/query-server"]
    restart: unless-stopped
    environment:
      QUERY_ADDR: ":8088"
      QUERY_ISSUER: "${QUERY_ISSUER:-10000}"
      QUERY_GAME_ID: "${QUERY_GAME_ID:-125}"
      QUERY_SERVER_RECORDS: "${QUERY_SERVER_RECORDS:-}"
      LEGACY_SERVER_ID: "${LEGACY_SERVER_ID:-legacy-1}"
      LEGACY_SERVER_DISTRICT: "${LEGACY_SERVER_DISTRICT:-Legacy}"
      LEGACY_SERVER_HOST: "${LEGACY_SERVER_HOST:-}"
      LEGACY_SERVER_PORT: "${LEGACY_SERVER_PORT:-7001}"
      LEGACY_SERVER_TYPE: "${LEGACY_SERVER_TYPE:-1}"
      LEGACY_SERVER_OPEN: "${LEGACY_SERVER_OPEN:-1}"
      LEGACY_SERVER_LOAD: "${LEGACY_SERVER_LOAD:-0}"
      LEGACY_SERVER_PRIORITY: "${LEGACY_SERVER_PRIORITY:-0}"
    ports:
      - "${QUERY_PORT:-88}:8088/tcp"

  member:
    build: .
    entrypoint: ["/usr/local/bin/member-server"]
    restart: unless-stopped
    environment:
      MEMBER_ADDR: ":7001"
      MEMBER_SEND_SET_VERIFY: "${MEMBER_SEND_SET_VERIFY:-false}"
      MEMBER_SET_VERIFY_FIELD0: "${MEMBER_SET_VERIFY_FIELD0:-0}"
      MEMBER_SET_VERIFY_MODE: "${MEMBER_SET_VERIFY_MODE:-0}"
      MEMBER_SET_VERIFY_KEY_HEX: "${MEMBER_SET_VERIFY_KEY_HEX:-}"
      MEMBER_SEND_SET_ENCODE: "${MEMBER_SEND_SET_ENCODE:-false}"
    ports:
      - "${MEMBER_PORT:-7001}:7001/tcp"

  gateway:
    build: .
    command: ["/usr/local/bin/gateway"]
    restart: unless-stopped
    environment:
      GATEWAY_ADDR: ":8080"
      GAME_PUBLIC_HOST: "${GAME_PUBLIC_HOST:-127.0.0.1}"
      GAME_PORT: "7000"
      MATCH_SIZE: "${MATCH_SIZE:-2}"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  game:
    build: .
    entrypoint: ["/usr/local/bin/game-server"]
    restart: unless-stopped
    environment:
      GAME_ADDR: ":7000"
    ports:
      - "${GAME_PORT:-7000}:7000/tcp"
